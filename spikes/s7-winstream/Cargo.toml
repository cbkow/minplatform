[package]
name = "s7-winstream"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false
license = "MIT OR Apache-2.0"
description = "minplatform spike — dies after its verdict (docs/spikes/S7-winstream.md)"

[dependencies]
wgpu = { workspace = true }
pollster = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Ole", "Win32_Security", "Win32_System_Threading", "Win32_UI_Shell_PropertiesSystem"] }
