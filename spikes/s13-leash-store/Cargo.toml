[package]
name = "s13-leash-store"
version = "0.0.0"
edition = "2024"
publish = false

# S13 - does Windows object to the leash (docs/spikes/S13-leash-defender-store.md)? A windowed program that relaunches
# itself hidden for every "chunk", as a packaged application would. A spike; it dies with its verdict.
[[bin]]
name = "s13"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Storage_Packaging_Appx"] }
