[package]
name = "s9-uia"
version = "0.0.0"
edition = "2024"
publish = false

# S9 step 5 — the Windows reference window (docs/spikes/S9-desktop-text.md): a hand-drawn text window with a hand-written
# UI Automation provider that logs every call. A spike; it dies with its verdict.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_LibraryLoader", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
windows-core = "0.62"   # the implement macro names it
