[package]
name = "s19-native-menus"
version = "0.0.0"
edition = "2024"
publish = false

# A spike for the UFB port (canon row 459; its question, pass bar and verdict: docs/spikes). It dies with its verdict.
[[bin]]
name = "s19"
path = "src/main.rs"

[dependencies]
winit = { package = "winit", version = "=0.31.0-beta.4", default-features = false }
raw-window-handle = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-foundation = { workspace = true }
objc2-app-kit = { workspace = true, features = ["objc2-uniform-type-identifiers"] }
objc2-uniform-type-identifiers = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Registry", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse"] }
