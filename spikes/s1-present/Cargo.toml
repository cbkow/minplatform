[package]
name = "s1-present"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false
license = "MIT OR Apache-2.0"
description = "minplatform spike — dies after its verdict (docs/spikes/)"

[features]
ocio = []   # S1 step 2: needs an installed OpenColorIO 2.5 (build.rs)

[build-dependencies]
cc = { workspace = true }

[dependencies]
wgpu = { workspace = true }
winit = { workspace = true }
raw-window-handle = { workspace = true }
pollster = { workspace = true }
bytemuck = { workspace = true }
anyhow = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }
ffmpeg-sys-next = { workspace = true }
crossbeam-channel = { workspace = true }
libc = { workspace = true }
png = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi_Common", "Win32_Foundation", "Win32_System_Threading"] }   # the version wgpu-hal 30 uses: raw ID3D12 handles cross the hal boundary

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-metal = { workspace = true }
objc2-quartz-core = { workspace = true, features = ["CAMetalLayer", "CALayer", "objc2-metal", "objc2-core-graphics"] }
objc2-core-graphics = { workspace = true, features = ["CGColorSpace"] }
objc2-foundation = { workspace = true }
objc2-app-kit = { version = "0.3", features = ["NSView", "NSResponder", "NSScreen"] }
objc2-core-video = { workspace = true }
objc2-core-foundation = { workspace = true }
