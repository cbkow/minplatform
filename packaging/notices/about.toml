# cargo-about (packaging/notices/make_notices.py runs it): the licences a crate linked into QCView may carry. A crate with
# anything else FAILS the notices — and so the package — until someone has read its licence and listed it here.
# All of these are compatible with the app's GPL-3.0.
accepted = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "0BSD",
    "Unicode-3.0", "Unicode-DFS-2016", "BSL-1.0", "CC0-1.0", "Unlicense", "MPL-2.0", "OFL-1.1", "LicenseRef-UFL-1.0", "Ubuntu-font-1.0",
    "WTFPL", "GPL-3.0", "GPL-3.0-only", "GPL-3.0-or-later", "LGPL-3.0", "LGPL-2.1", "NCSA", "CDLA-Permissive-2.0",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
