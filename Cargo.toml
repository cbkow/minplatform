# minplatform — the shared Rust media platform for the min*/QCView family (THEORETICAL phase).
# The workspace owns every ecosystem pin (docs/rust-wgpu-port.md §21, row 117). No members yet:
# crates/ gains a member only when it has a consumer or a frozen contract; spikes/ when a spike starts.
[workspace]
resolver = "2"
members = []

[workspace.package]
edition = "2024"
rust-version = "1.85"
authors = ["Chris Bialkowski"]
repository = "https://github.com/cbkow/minplatform"

[workspace.dependencies]
# Pinned here once, consumed with `{ workspace = true }`. Filled in by the first spike (S1/S3),
# not in advance — see docs/rust-wgpu-port.md §21.3.
