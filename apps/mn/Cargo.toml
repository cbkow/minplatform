[package]
name = "mn"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
license = "GPL-3.0-or-later"
description = "minNotes on the platform (Phase 3). Step 2: a note drawn in a window on QCView's presenter — read-only so far"

[[bin]]
name = "minNotes"
