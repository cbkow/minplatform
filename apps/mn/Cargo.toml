[package]
name = "mn"
version = "3.0.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
license = "GPL-3.0-or-later"
description = "minNotes on the platform (Phase 3). Step 2: a note drawn in a window on QCView's presenter — read-only so far"

[[bin]]
name = "minNotes"
path = "src/main.rs"

[dependencies]
ring = "0.17"
mn-doc = { path = "../../crates/mn-doc" }
mn-layout = { path = "../../crates/mn-layout" }
mn-store = { path = "../../crates/mn-store" }
min-present = { path = "../../crates/min-present" }
min-ui = { path = "../../crates/min-ui" }
min-theme = { path = "../../crates/min-theme" }
vello = { workspace = true }
peniko = { workspace = true }
kurbo = { workspace = true }
parley = { workspace = true }
winit31 = { workspace = true }
wgpu = { workspace = true }
raw-window-handle = { workspace = true }
png = { workspace = true }
serde_json = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }
mn-edit = { path = "../../crates/mn-edit" }
arboard = { workspace = true, features = ["image-data"] }
min-image = { path = "../../crates/min-image" }
# GIF and WebP (their first frame): formats the notes take that the family's decoder (QCView's formats) does not
image = { version = "0.25", default-features = false, features = ["gif", "webp"] }
# SVG, drawn to pixels at the size wanted (text with the machine's fonts)
resvg = "0.45"
# pictures named by pasted web content are fetched and kept with the collection (row 314)
ureq = "3"
# PDF pages and their text (spike S10; behind apps/mn/src/pdf.rs)
hayro = "0.9"
# video: the family's decoder and player (QCView's), row 316
qcv-player = { path = "../../crates/qcv-player" }
# a clip's notes: QCView's sidecar (frozen) and its annotation code, shared
qcv-notes = { path = "../../crates/qcv-notes" }
qcv-annotate = { path = "../../crates/qcv-annotate" }
base64 = "0.22"
min-paths = { path = "../../crates/min-paths", features = ["serde"] }
rfd = "0.18"
# the time an export says it was made at
jiff = "0.2"
# a PDF is written with krilla (as QCView's notes export; spike S11)
krilla = { version = "0.8.2", default-features = false, features = ["raster-images", "simple-text"] }
# a Word document is a zip (as QCView's notes export writes it)
zip = { version = "9.5", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(unix)'.dependencies]
# the room left on a disk (the package / Collect Media window)
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-foundation = { workspace = true, features = ["NSString", "NSGeometry", "NSRange", "NSUserDefaults", "objc2-core-foundation"] }
muda = { version = "0.21", default-features = false }
objc2-app-kit = { workspace = true, features = ["NSWindow", "NSResponder", "NSApplication"] }
# HEIC and camera RAW through the system's decoders (ImageIO)
objc2-image-io = { version = "0.3.2", default-features = false, features = ["std", "CGImageSource", "objc2-core-graphics"] }
objc2-core-graphics = { workspace = true, features = ["CGImage", "CGContext", "CGBitmapContext", "CGColorSpace", "CGGeometry"] }
objc2-core-foundation = { workspace = true, features = ["CFURL", "CFDictionary", "CFNumber", "CFString", "CFBase", "CFCGTypes"] }
