[package]
name = "qcv"
version = "3.0.2"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
license = "GPL-3.0-or-later"
description = "minplatform — the QCView-shaped reference app where min-ui is born (canon §21.4, Phase 2)"

# the user 2026-11-09: the app is QCView — the binary (Dock, ⌘-Tab, Task Manager) says so; the package, crates, settings store,
# log folder and single-instance socket keep the short `qcv` (they must not collide with the Qt QCView beside it)
[[bin]]
name = "QCView"
path = "src/main.rs"

[dependencies]
min-present = { path = "../../crates/min-present" }
min-ui = { path = "../../crates/min-ui" }
min-theme = { path = "../../crates/min-theme" }
min-settings = { path = "../../crates/min-settings" }
min-i18n = { path = "../../crates/min-i18n" }
qcv-color = { path = "../../crates/qcv-color" }
vello = { workspace = true }
peniko = { workspace = true }
parley = { workspace = true }
kurbo = { workspace = true }
qcv-player = { path = "../../crates/qcv-player" }
qcv-ring = { path = "../../crates/qcv-ring" }
qcv-meta = { path = "../../crates/qcv-meta" }
qcv-notes = { path = "../../crates/qcv-notes" }
qcv-project = { path = "../../crates/qcv-project" }
rfd = "0.18"
qcv-timeline = { path = "../../crates/qcv-timeline" }
min-paths = { path = "../../crates/min-paths" }
winit31 = { workspace = true }
wgpu = { workspace = true }
raw-window-handle = { workspace = true }
# single instance (row 143): a per-user local socket (Unix socket / Windows named pipe)
interprocess = "2.4"
serde_json = { workspace = true }
# local timestamps for the file log (already in the tree through env_logger)
jiff = "0.2"
png = { workspace = true }
half = "2.4"
# captures (row 216): the writers, and the clipboard's image
min-image = { path = "../../crates/min-image" }
arboard = { workspace = true, features = ["image-data"] }
env_logger = { workspace = true }
log = { workspace = true }
sys-locale = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
# the native menu bar (row 143); Windows draws QCView's in-window bar instead (row 194)
muda = { version = "0.21", default-features = false }
objc2 = { workspace = true }
objc2-foundation = { workspace = true, features = ["NSString", "NSUserDefaults", "NSArray", "NSURL", "NSObject", "NSEnumerator", "NSBundle"] }
objc2-app-kit = { workspace = true, features = ["NSMenu", "NSMenuItem", "NSApplication", "NSResponder", "NSWindow", "NSScreen", "NSWorkspace"] }

[target.'cfg(windows)'.dependencies]
# Windows shortcuts (.lnk) resolve through the shell's IShellLink (QCView's QFileInfo::symLinkTarget)
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_Storage_FileSystem", "Win32_Devices_Display", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_System_Console"] }

# Windows: the exe's icon (the regular Windows icon — taskbar, Explorer, the Store tiles), its version details and
# QCView's long-path manifest (build.rs; canon row 248)
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
