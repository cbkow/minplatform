[package]
name = "ufb"
version = "2.0.0-dev"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"
description = "UFB on the platform (Phase 5): a file browser"

# UFB, the rebuild (Phase 5; canon rows 434-469). No settings file, no database of an installed 1.4.x. It changes
# files only inside the folders it is started with (row 468's safety belt), and writes its own thumbnail cache in the
# system's cache location (row 465).
[[bin]]
name = "UFB"
path = "src/main.rs"

[dependencies]
winit31 = { workspace = true }
min-present = { path = "../../crates/min-present" }
min-ui = { path = "../../crates/min-ui" }
min-theme = { path = "../../crates/min-theme" }
vello = { workspace = true }
peniko = { workspace = true }
kurbo = { workspace = true }
wgpu = { workspace = true }
raw-window-handle = { workspace = true }
png = { workspace = true }
arboard = { workspace = true }
# the family's decoders, used in the HELPER copies of this executable only (canon row 456)
min-image = { path = "../../crates/min-image" }
# a video's frame: the family's player (FFmpeg) and its colour stage; Radiance HDR: the `image` crate's reader
qcv-player = { path = "../../crates/qcv-player" }
qcv-meta = { path = "../../crates/qcv-meta" }
image = { version = "0.25", default-features = false, features = ["hdr"] }
# the thumbnails' cache on disk, opened by the helpers (canon row 456, point 4)
rusqlite = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", default-features = false }
objc2 = { workspace = true, features = ["exception"] }   # what AppKit throws inside a callback of ours is caught (the context menu)
objc2-foundation = { workspace = true, features = ["NSString", "NSGeometry", "NSUserDefaults", "NSObject", "NSURL", "NSError"] }
block2 = "0.6"
objc2-quick-look-thumbnailing = { version = "=0.3.2", features = ["QLThumbnailGenerator", "QLThumbnailGenerationRequest", "QLThumbnailRepresentation", "QLThumbnailErrors", "block2", "objc2-core-graphics", "objc2-core-foundation"] }
objc2-core-foundation = { workspace = true, features = ["CFCGTypes"] }
objc2-core-graphics = { workspace = true, features = ["CGBitmapContext", "CGContext", "CGImage", "CGColorSpace"] }
objc2-app-kit = { workspace = true, features = ["NSWorkspace", "NSImage", "NSImageRep", "NSGraphicsContext", "NSWindow", "NSResponder", "NSApplication", "objc2-uniform-type-identifiers", "objc2-core-graphics"] }
objc2-uniform-type-identifiers = { version = "0.3.2", features = ["UTType"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_Storage_FileSystem", "Win32_System_Time", "Win32_System_SystemInformation", "Win32_UI_Shell_Common", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Diagnostics_Debug", "Win32_Security", "Win32_NetworkManagement_WNet"] }
