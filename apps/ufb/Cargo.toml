[package]
name = "ufb"
version = "2.0.0-dev"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"
description = "UFB on the platform (Phase 5): a file browser"

# UFB, the rebuild (Phase 5; canon rows 434-479). No settings file, no database of an installed 1.4.x. It changes
# files only inside the folders it is started with (row 468's safety belt), and writes its own thumbnail cache in the
# system's cache location (row 465).
[[bin]]
name = "UFB"
path = "src/main.rs"

[dependencies]
winit31 = { workspace = true }
min-present = { path = "../../crates/min-present" }
min-ui = { path = "../../crates/min-ui" }
# the family's one image-sequence detector, with the browser's grouping rules (canon row 475)
min-paths = { path = "../../crates/min-paths" }
# real drags of files to and from the system (canon row 472)
min-dnd = { path = "../../crates/min-dnd" }
min-theme = { path = "../../crates/min-theme" }
vello = { workspace = true }
peniko = { workspace = true }
kurbo = { workspace = true }
wgpu = { workspace = true }
raw-window-handle = { workspace = true }
png = { workspace = true }
arboard = { workspace = true }
# the family's decoders, used in the HELPER copies of this executable only (canon row 456)
min-image = { path = "../../crates/min-image" }
# a video's frame: the family's player (FFmpeg) and its colour stage; Radiance HDR: the `image` crate's reader
qcv-player = { path = "../../crates/qcv-player" }
qcv-meta = { path = "../../crates/qcv-meta" }
qcv-timeline = { path = "../../crates/qcv-timeline" }
# what the application remembers between launches (the family's settings service)
min-settings = { path = "../../crates/min-settings" }
ufb-projtype = { path = "../../crates/ufb-projtype" }
uuid = { workspace = true }
rfd = "0.18"
serde_json = "1"
# PDF pages in the lightbox (the family's reader)
min-pdf = { path = "../../crates/min-pdf" }
image = { version = "0.25", default-features = false, features = ["hdr"] }
# the thumbnails' cache on disk, opened by the helpers (canon row 456, point 4)
rusqlite = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", default-features = false }
objc2 = { workspace = true, features = ["exception"] }   # what AppKit throws inside a callback of ours is caught (the context menu)
objc2-foundation = { workspace = true, features = ["NSString", "NSGeometry", "NSUserDefaults", "NSObject", "NSURL", "NSError"] }
block2 = "0.6"
objc2-quick-look-thumbnailing = { version = "=0.3.2", features = ["QLThumbnailGenerator", "QLThumbnailGenerationRequest", "QLThumbnailRepresentation", "QLThumbnailErrors", "block2", "objc2-core-graphics", "objc2-core-foundation"] }
objc2-core-foundation = { workspace = true, features = ["CFCGTypes"] }
objc2-core-graphics = { workspace = true, features = ["CGBitmapContext", "CGContext", "CGImage", "CGColorSpace"] }
objc2-app-kit = { workspace = true, features = ["NSWorkspace", "NSImage", "NSImageRep", "NSGraphicsContext", "NSWindow", "NSView", "NSResponder", "NSApplication", "objc2-uniform-type-identifiers", "objc2-core-graphics"] }
objc2-uniform-type-identifiers = { version = "0.3.2", features = ["UTType"] }
# an HTML file in the lightbox: the system's own web view (spike S15; no engine is bundled). macOS only until S15 has run on Windows.
wry = { version = "=0.57.2", default-features = false, features = ["os-webview"] }
objc2-web-kit = { version = "=0.3.2", default-features = false, features = ["std", "block2", "WKScriptMessageHandler", "WKScriptMessage", "WKUserContentController", "WKContentRuleList", "WKContentRuleListStore"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_Storage_FileSystem", "Win32_System_Time", "Win32_System_SystemInformation", "Win32_UI_Shell_Common", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Diagnostics_Debug", "Win32_Security", "Win32_NetworkManagement_WNet", "Win32_System_Ole", "Win32_System_Registry", "Win32_UI_Input_KeyboardAndMouse"] }
