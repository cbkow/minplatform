[package]
name = "ufb"
version = "2.0.0-dev"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"
description = "UFB on the platform (Phase 5): a file browser. Slice 2a: a browser to look around in - read-only"

# UFB, the rebuild (Phase 5; canon rows 434-463). This slice reads folders and nothing else: no settings file, no
# database, nothing of an installed 1.4.x, and no file is ever created, renamed, moved or deleted by it.
[[bin]]
name = "UFB"
path = "src/main.rs"

[dependencies]
winit31 = { workspace = true }
min-present = { path = "../../crates/min-present" }
min-ui = { path = "../../crates/min-ui" }
min-theme = { path = "../../crates/min-theme" }
vello = { workspace = true }
peniko = { workspace = true }
kurbo = { workspace = true }
wgpu = { workspace = true }
raw-window-handle = { workspace = true }
png = { workspace = true }
arboard = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", default-features = false }
objc2 = { workspace = true }
objc2-foundation = { workspace = true, features = ["NSString", "NSGeometry", "NSUserDefaults", "NSObject"] }
objc2-core-foundation = { workspace = true, features = ["CFCGTypes"] }
objc2-core-graphics = { workspace = true, features = ["CGBitmapContext", "CGContext", "CGImage", "CGColorSpace"] }
objc2-app-kit = { workspace = true, features = ["NSWorkspace", "NSImage", "NSImageRep", "NSGraphicsContext", "NSWindow", "NSResponder", "NSApplication", "objc2-uniform-type-identifiers", "objc2-core-graphics"] }
objc2-uniform-type-identifiers = { version = "0.3.2", features = ["UTType"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_Storage_FileSystem", "Win32_System_Time", "Win32_System_SystemInformation"] }
