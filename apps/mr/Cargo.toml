[package]
name = "mr"
version = "1.0.0"
edition = "2024"
publish = false

# minRender, the port (Phase 4; canon rows 385-393): ONE executable - the node, and, started again with `--leash`, the
# small process that owns a render's process tree (rows 387-388). Its contract with a 0.5.x farm is
# docs/phase4/step0-contracts.md; `tools/mr-conform` holds it to that.
[[bin]]
name = "minRender"
path = "src/main.rs"

[dependencies]
serde_json = { workspace = true }
serde = { workspace = true }
regex = "1"
sha2 = "0.10"
socket2 = { version = "0.5", features = ["all"] }
winit31 = { workspace = true }
tray-icon = { version = "0.21", default-features = false }
interprocess = "2.4"
min-present = { path = "../../crates/min-present" }
min-ui = { path = "../../crates/min-ui" }
min-theme = { path = "../../crates/min-theme" }
vello = { workspace = true }
peniko = { workspace = true }
kurbo = { workspace = true }
wgpu = { workspace = true }
raw-window-handle = { workspace = true }
png = { workspace = true }
min-image = { path = "../../crates/min-image" }
half = "2.4"
rfd = "0.18"
arboard = { workspace = true }
rusqlite = { workspace = true }
min-paths = { path = "../../crates/min-paths" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-foundation = { workspace = true, features = ["NSObject"] }
objc2-app-kit = { workspace = true, features = ["NSApplication", "NSResponder", "NSRunningApplication"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_Security_Cryptography", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Storage_Packaging_Appx", "Win32_System_Recovery", "ApplicationModel", "ApplicationModel_Activation"] }

# the exe's icon and version details on Windows (build.rs; as minNotes', row 372)
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
