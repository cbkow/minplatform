[package]
name = "qcv-stream"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
license = "GPL-3.0-or-later"
description = "minplatform — QCView's stream output (canon row 239; QCView `src/output/`): a native hardware H.264 session per OS (VideoToolbox / Media Foundation) fed zero-copy from our own GPU NV12 pass, FFmpeg's AAC, mpegts over SRT / flv over RTMP, the paced session"

[dependencies]
wgpu = { workspace = true }
ffmpeg-sys-next = { workspace = true }
bytemuck = { workspace = true }
libc = { workspace = true }
log = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-metal = { workspace = true, features = ["objc2-io-surface"] }
objc2-io-surface = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Ole", "Win32_Security", "Win32_System_Threading", "Win32_UI_Shell_PropertiesSystem"] }   # the Media Foundation session on a D3D11 device, its surfaces shared from wgpu's DX12 (spike S7)

[dev-dependencies]
min-present = { path = "../min-present" }
