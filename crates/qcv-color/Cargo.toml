[package]
name = "qcv-color"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
license = "GPL-3.0-only"
description = "QCView's colour engines for min-present's stage-2 slot (canon §18, rows 198-204): minColor (the vendored minColorAE core, GPL-3.0-only) as one WGSL compute pass"

[dependencies]
min-present = { path = "../min-present" }
wgpu = { workspace = true }
bytemuck = { workspace = true }
log = { workspace = true }

[build-dependencies]
cc = "1"
naga = { version = "=30.0.1", features = ["glsl-in", "wgsl-in", "wgsl-out"] }

[dev-dependencies]
pollster = { workspace = true }
