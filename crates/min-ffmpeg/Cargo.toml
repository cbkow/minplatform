[package]
name = "min-ffmpeg"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
license = "GPL-3.0-or-later"
description = "minplatform — the family's FFmpeg substrate (canon row 188): FFmpeg 9 behind thin RAII (sessions, the frame index, seeks), the hardware-decode devices and routing, the read-ahead warmer, the thread policy, the RGB range rule; decoded frames come out as min-present frames. Lifted from qcv-player 2026-11-07; every app decodes through this crate."

[dependencies]
min-present = { path = "../min-present" }
qcv-timeline = { path = "../qcv-timeline" }
qcv-meta = { path = "../qcv-meta" }
min-paths = { path = "../min-paths" }
ffmpeg-sys-next = { workspace = true }
libc = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Threading", "Win32_Foundation"] }
windows = { workspace = true, features = ["Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi_Common", "Win32_Foundation", "Win32_Security"] }   # S6: shared D3D12 plane textures + fence for the Vulkan bridge
ash = "0.38"   # S6: FFmpeg's Vulkan device driven through its own function pointers (no loader)
