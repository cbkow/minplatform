[package]
name = "qcv-player"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
license = "GPL-3.0-or-later"
description = "minplatform — QCView's player carried by crate (canon §4): FFmpeg 9 behind thin RAII, hardware decode shared with the presenter, the streaming slot, the rational clock (born in Phase 2 step 1)"

[dependencies]
min-present = { path = "../min-present" }
min-ffmpeg = { path = "../min-ffmpeg" }
min-image = { path = "../min-image" }
half = "2.4"
qcv-timeline = { path = "../qcv-timeline" }
qcv-meta = { path = "../qcv-meta" }
min-paths = { path = "../min-paths" }
# QCBridge host feeds (canon rows 227-228)
qcv-ring = { path = "../qcv-ring" }
wgpu = { workspace = true }
ffmpeg-sys-next = { workspace = true }
crossbeam-channel = { workspace = true }
libc = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
soundtouch = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-audio-toolbox = { workspace = true, features = ["std", "AUComponent", "AudioComponent", "AudioOutputUnit", "AudioUnitProperties", "objc2-core-audio-types"] }
objc2-core-audio-types = { workspace = true, features = ["std", "CoreAudioBaseTypes"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Threading", "Win32_Foundation", "Win32_System_ProcessStatus"] }
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_Media_Multimedia", "Win32_Media", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Threading"] }   # step 2b: WASAPI (StructuredStorage + Variant gate IMMDevice::Activate in windows 0.62)
