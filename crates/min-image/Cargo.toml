[package]
name = "min-image"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
license = "GPL-3.0-or-later"
description = "minplatform — ONE image decoding stack (canon §10.4, rows 34 / 148): OpenEXR through the OpenEXRCore C library (parts, layers, every compression, parallel chunk decode), PNG / TIFF (pure Rust) and JPEG through libjpeg-turbo (TurboJPEG), QCView's quirks carried, sentinels for gap / broken frames. Step 2c of Phase 2."

[dependencies]
log = { workspace = true }
thiserror = { workspace = true }
half = "2.4"
png = "0.18"
tiff = "0.11"
# TGA + BMP only (canon row 191): the pure-Rust decoders, no other format
image = { version = "0.25", default-features = false, features = ["tga", "bmp"] }

[target.'cfg(target_os = "macos")'.dependencies]
# HEIC and camera RAW through the system's decoders (ImageIO)
objc2-image-io = { version = "0.3.2", default-features = false, features = ["std", "CGImageSource", "objc2-core-graphics"] }
objc2-core-graphics = { workspace = true, features = ["CGImage", "CGContext", "CGBitmapContext", "CGColorSpace", "CGGeometry"] }
objc2-core-foundation = { workspace = true, features = ["CFURL", "CFDictionary", "CFNumber", "CFString", "CFBase", "CFCGTypes"] }

[dev-dependencies]

[build-dependencies]
bindgen = "0.71"
pkg-config = "0.3"
