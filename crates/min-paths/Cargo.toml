[package]
name = "min-paths"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
license = "MIT OR Apache-2.0"
description = "The family's path kit: file URLs, text/uri-list, {vol,rel} refs and cross-OS translation, the one image-sequence detector, source classifiers, same-volume and drop guards, clipboard file lists, safe names, family links (canon §22)"

[features]
default = []
serde = ["dep:serde"]

[dependencies]
serde = { workspace = true, optional = true }
arboard = { workspace = true }
libc = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-foundation = { workspace = true, features = ["NSURL", "NSString", "NSArray", "NSEnumerator"] }
objc2-app-kit = { workspace = true, features = ["NSPasteboard", "NSPasteboardItem"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Shell", "Win32_NetworkManagement_WNet", "Win32_System_Ole"] }
