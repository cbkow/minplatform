[package]
name = "qcv-notes"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
license = "GPL-3.0-or-later"
description = "QCView's annotation notes as a FROZEN contract (canon row 215): the `.qcview/<media>/notes.json` sidecar + `images/` read and written byte-for-byte (minNotes reads the same files — 1:1 forever), annotation_data v2.0 strokes, the timecode key"

[dependencies]
serde_json = { workspace = true, features = ["float_roundtrip"] }   # exact parsing: the sidecar round-trips byte for byte
log = { workspace = true }
qcv-meta = { path = "../qcv-meta" }
kurbo = { workspace = true }
# the exports (row 217): DOCX = a zip of OOXML, PDF = krilla (Geist embedded), text measured with skrifa (krilla's version)
zip = { version = "9.5", default-features = false, features = ["deflate-flate2"] }
krilla = { version = "0.8.2", default-features = false, features = ["raster-images", "simple-text"] }
skrifa = "0.42"
